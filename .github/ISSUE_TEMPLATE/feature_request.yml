name: Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Suggest something that would make InvenSoft Pro better."
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated (optional).
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, or references.