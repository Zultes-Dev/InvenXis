name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (React) build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check & build
        run: npm run build
      - name: Lint
        run: npm run lint

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Migrate + seed demo data
        run: |
          python manage.py migrate
          python manage.py seed_data
      - name: Start Django API
        run: nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django.log 2>&1 &
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Vite dev server
        working-directory: frontend
        run: nohup npm run dev > /tmp/vite.log 2>&1 &
      - name: Wait for servers
        run: sleep 10
      - name: Run Playwright smoke
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3000