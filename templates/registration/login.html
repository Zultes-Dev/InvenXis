<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvenXis — Sistema de Gestión de Inventarios</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0d0e0f;
  --bg-secondary: #121416;
  --bg-card: #181b1e;
  --border: #252a2f;
  --border-light: #2e343a;
  --amber: #e8a230;
  --amber-dim: #c4871f;
  --amber-glow: rgba(232, 162, 48, 0.12);
  --amber-glow-strong: rgba(232, 162, 48, 0.22);
  --text-primary: #e8e6e1;
  --text-secondary: #8a8f96;
  --text-muted: #4e5560;
  --danger: #e05a4e;
  --danger-glow: rgba(224, 90, 78, 0.15);
  --success: #4ecb91;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Syne', sans-serif;
  background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}
.login-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  width: 100%;
}
.login-box {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  padding: 48px 40px;
  width: 420px;
  max-width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: loginFadeIn 0.5s ease;
}
@keyframes loginFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo-icon {
  width: 64px; height: 64px;
  background: var(--amber);
  border-radius: 12px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  color: #0d0e0f;
  box-shadow: 0 0 30px var(--amber-glow-strong);
}
.login-title { font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.5px; }
.login-subtitle { font-size: 13px; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.login-form { display: flex; flex-direction: column; gap: 20px; }
.login-field { display: flex; flex-direction: column; gap: 8px; }
.login-label { font-size: 12px; font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.login-input-wrap { position: relative; }
.login-input {
  width: 100%;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text-primary);
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
}
.login-input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); }
.login-input::placeholder { color: var(--text-muted); }
.login-error {
  background: var(--danger-glow);
  border: 1px solid rgba(224,90,78,0.3);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12.5px;
  color: var(--danger);
  display: none;
}
.login-error.show { display: block; }
.login-btn {
  background: var(--amber);
  color: #0d0e0f;
  border: none;
  border-radius: 8px;
  padding: 14px;
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 0 20px var(--amber-glow-strong);
  margin-top: 8px;
}
.login-btn:hover { background: #f0ad38; box-shadow: 0 0 30px rgba(232,162,48,0.4); transform: translateY(-1px); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-footer { text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
.login-hint { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; line-height: 1.6; }
.login-hint strong { color: var(--amber); font-weight: 500; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">IX</div>
      <div class="login-title">InvenXis</div>
      <div class="login-subtitle">Sistema de Gestión de Inventarios • PRO</div>
    </div>

    <form class="login-form" method="post">
      {% csrf_token %}

      <div class="login-error show" id="loginError" {% if not form.errors %}style="display:none"{% endif %}>
        <strong>Error:</strong> Usuario o contraseña incorrectos. Inténtalo de nuevo.
      </div>

      <div class="login-field">
        <label class="login-label">Usuario</label>
        <div class="login-input-wrap">
          <input type="text" name="username" class="login-input" placeholder="Ingresa tu usuario" required autofocus>
        </div>
      </div>

      <div class="login-field">
        <label class="login-label">Contraseña</label>
        <div class="login-input-wrap">
          <input type="password" name="password" class="login-input" placeholder="Ingresa tu contraseña" required>
        </div>
      </div>

      <button type="submit" class="login-btn">Iniciar Sesión</button>
    </form>

    <div class="login-footer">
      <div class="login-hint">
        <strong>Admin:</strong> admin / admin<br>
        <strong>Operador:</strong> operador / operador123
      </div>
    </div>
  </div>
</div>

</body>
</html>
