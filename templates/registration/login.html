<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvPro — Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #0d0e0f 0%, #1a1d23 100%); min-height: 100vh; }
        .login-card { background: #181b1e; border: 1px solid #252a2f; border-radius: 16px; }
        .login-card .card-title { color: #e8a230; }
        .login-card .form-label { color: #8a8f96; font-size: 0.85rem; }
        .login-card .form-control { background: #121416; border: 1px solid #252a2f; color: #e8e6e1; }
        .login-card .form-control:focus { border-color: #e8a230; box-shadow: 0 0 0 0.2rem rgba(232,162,48,0.25); }
        .login-card .btn-primary { background: #e8a230; border-color: #e8a230; color: #0d0e0f; font-weight: 600; }
        .login-card .btn-primary:hover { background: #f0ad38; border-color: #f0ad38; }
        .login-card .text-muted { color: #4e5560 !important; }
    </style>
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-card p-4 rounded-4 shadow-lg">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center"
                             style="width:64px;height:64px;background:#e8a230;border-radius:12px;font-size:24px;font-weight:700;color:#0d0e0f">
                            IP
                        </div>
                        <h3 class="mt-3 fw-bold" style="color:#e8a230">InvPro</h3>
                        <p class="text-muted small">Sistema de Gestión de Inventarios</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {% if form.errors %}
                            <div class="alert alert-danger py-2 small">
                                Usuario o contraseña incorrectos.
                            </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Usuario</label>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Contraseña</label>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Ingresa tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Iniciar Sesión</button>
                    </form>
                    <div class="text-center mt-3">
                        <small class="text-muted">
                            <strong>Admin:</strong> admin / admin &nbsp;&nbsp;
                            <strong>Operador:</strong> operador / operador123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
