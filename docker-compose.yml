services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-invenxis}
      POSTGRES_USER: ${DB_USER:-invenxis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-invenxis_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    environment:
      DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-invenxis}
      DB_USER: ${DB_USER:-invenxis}
      DB_PASSWORD: ${DB_PASSWORD:-invenxis_dev}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es requerida en prod}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
